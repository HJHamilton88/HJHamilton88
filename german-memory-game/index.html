<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7f1d1d" />
  <title>German Verb Memory Match</title>
  <style>
    :root {
      --bg:#f6f2ea; --panel:#fffdf8; --ink:#221f1b; --muted:#746d63;
      --accent:#8b2f2f; --accent2:#6f2323; --line:#ded6ca; --good:#dff3df;
      --shadow:0 8px 24px rgba(60,40,20,.09);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    body{min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    .app{max-width:980px;margin:auto;padding:18px 14px 28px}
    h1{font-size:clamp(1.55rem,5vw,2.15rem);line-height:1.1;margin:4px 0 6px}
    .intro{margin:0 0 14px;color:var(--muted);line-height:1.45}
    .toolbar,.rulebox{background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}
    .toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:10px;margin-bottom:10px}
    select,button{font:inherit}
    select,.action{min-height:44px;border:1px solid var(--line);border-radius:11px;background:white;color:var(--ink);padding:9px 12px}
    .action{cursor:pointer;font-weight:650;touch-action:manipulation}
    .action:active{transform:translateY(1px)}
    .stats{display:flex;gap:14px;margin-left:auto;font-weight:700;font-size:.96rem}
    .rulebox{padding:10px 12px;margin-bottom:12px;color:var(--muted);font-size:.94rem;line-height:1.4}
    .rulebox b{color:var(--ink)}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
    .card{position:relative;aspect-ratio:1/1;min-height:86px;border:0;padding:0;background:none;perspective:900px;cursor:pointer;touch-action:manipulation}
    .card-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .22s ease}
    .card.flipped .card-inner,.card.matched .card-inner{transform:rotateY(180deg)}
    .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:13px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;box-shadow:0 3px 10px rgba(0,0,0,.06);overflow:hidden}
    .front{background:linear-gradient(145deg,var(--accent),var(--accent2));color:white;font-size:1.45rem;font-weight:850}
    .back{background:white;transform:rotateY(180deg);font-size:clamp(.77rem,2.9vw,1rem);font-weight:750;line-height:1.18;word-break:normal}
    .kind{display:block;margin-top:5px;font-size:.68rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
    .card.matched .back{background:var(--good);border-color:#a8cfa8}
    .card.matched{cursor:default}
    .message{display:none;margin-top:12px;background:var(--good);border:1px solid #a8cfa8;border-radius:13px;padding:13px;text-align:center;font-weight:800}
    .footer{margin-top:12px;text-align:center;color:var(--muted);font-size:.86rem}
    @media (max-width:700px){
      .app{padding:12px 10px 22px}
      .toolbar{gap:7px}
      .stats{width:100%;margin-left:0;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px}
      .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
      .card{min-height:88px}
      .face{border-radius:11px;padding:6px}
    }
    @media (max-width:390px){
      .grid{gap:6px}
      .card{min-height:80px}
      .back{font-size:.73rem}
      .kind{font-size:.58rem}
    }
    @media (prefers-reduced-motion:reduce){.card-inner{transition:none}}
  </style>
</head>
<body>
<main class="app">
  <h1>German Verb Memory Match</h1>
  <p class="intro">Match each prompt, such as <b>du + kommen</b>, with the correct conjugated form, such as <b>du kommst</b>.</p>

  <section class="toolbar" aria-label="Game controls">
    <label for="pairCount"><b>Pairs:</b></label>
    <select id="pairCount" aria-label="Number of pairs">
      <option value="6">6</option>
      <option value="9" selected>9</option>
      <option value="12">12</option>
      <option value="18">All 18</option>
    </select>
    <button class="action" id="newGame" type="button">New game</button>
    <button class="action" id="peek" type="button">Peek 3 sec</button>
    <div class="stats" aria-live="polite">
      <span>Moves: <span id="moves">0</span></span>
      <span>Matched: <span id="matched">0</span>/<span id="total">9</span></span>
    </div>
  </section>

  <section class="rulebox">
    <b>Pattern:</b> ich <b>-e</b> · du <b>-st</b> · er/sie/es <b>-t</b> · wir <b>-en</b> · ihr <b>-t</b> · sie/Sie <b>-en</b>.<br>
    With <b>heißen</b>, remember <b>du heißt</b>.
  </section>

  <section id="grid" class="grid" aria-label="Memory game board"></section>
  <div id="message" class="message" role="status"></div>
  <div class="footer">Tap any two cards to look for a match.</div>
</main>

<script>
(() => {
  const pairs = [
    ["ich + kommen","ich komme"],
    ["du + kommen","du kommst"],
    ["er/sie/es + kommen","er/sie/es kommt"],
    ["wir + kommen","wir kommen"],
    ["ihr + kommen","ihr kommt"],
    ["sie/Sie + kommen","sie/Sie kommen"],
    ["ich + wohnen","ich wohne"],
    ["du + wohnen","du wohnst"],
    ["er/sie/es + wohnen","er/sie/es wohnt"],
    ["wir + wohnen","wir wohnen"],
    ["ihr + wohnen","ihr wohnt"],
    ["sie/Sie + wohnen","sie/Sie wohnen"],
    ["ich + heißen","ich heiße"],
    ["du + heißen","du heißt"],
    ["er/sie/es + heißen","er/sie/es heißt"],
    ["wir + heißen","wir heißen"],
    ["ihr + heißen","ihr heißt"],
    ["sie/Sie + heißen","sie/Sie heißen"]
  ];

  const grid = document.getElementById('grid');
  const pairCount = document.getElementById('pairCount');
  const movesEl = document.getElementById('moves');
  const matchedEl = document.getElementById('matched');
  const totalEl = document.getElementById('total');
  const message = document.getElementById('message');

  let first = null, second = null, locked = false, moves = 0, matched = 0, total = 9;

  function shuffle(arr){
    const a = [...arr];
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function buildDeck(count){
    const chosen = shuffle(pairs).slice(0,count);
    const deck = [];
    chosen.forEach((pair,id) => {
      deck.push({id,text:pair[0],kind:'Prompt'});
      deck.push({id,text:pair[1],kind:'Answer'});
    });
    return shuffle(deck);
  }

  function start(){
    total = Number(pairCount.value);
    moves = 0; matched = 0; first = null; second = null; locked = false;
    movesEl.textContent = '0'; matchedEl.textContent = '0'; totalEl.textContent = String(total);
    message.style.display = 'none'; message.textContent = '';
    grid.replaceChildren();

    buildDeck(total).forEach((item,index) => {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'card';
      card.dataset.pair = String(item.id);
      card.dataset.index = String(index);
      card.setAttribute('aria-label', `Hidden card ${index+1}`);
      card.innerHTML = `<span class="card-inner"><span class="face front">?</span><span class="face back"><span>${item.text}<span class="kind">${item.kind}</span></span></span></span>`;
      card.addEventListener('click', () => flip(card));
      grid.appendChild(card);
    });
  }

  function flip(card){
    if(locked || card.classList.contains('matched') || card === first) return;
    card.classList.add('flipped');
    card.setAttribute('aria-label', card.querySelector('.back').innerText.replace('\n',' — '));

    if(!first){ first = card; return; }
    second = card;
    moves++;
    movesEl.textContent = String(moves);

    if(first.dataset.pair === second.dataset.pair){
      first.classList.add('matched');
      second.classList.add('matched');
      first.classList.remove('flipped');
      second.classList.remove('flipped');
      matched++;
      matchedEl.textContent = String(matched);
      first = second = null;
      if(matched === total){
        message.textContent = `Complete — ${total} pairs in ${moves} moves.`;
        message.style.display = 'block';
        message.scrollIntoView({behavior:'smooth',block:'nearest'});
      }
    } else {
      locked = true;
      setTimeout(() => {
        [first,second].forEach(c => {
          c.classList.remove('flipped');
          c.setAttribute('aria-label', `Hidden card ${Number(c.dataset.index)+1}`);
        });
        first = second = null;
        locked = false;
      }, 850);
    }
  }

  document.getElementById('newGame').addEventListener('click', start);
  pairCount.addEventListener('change', start);
  document.getElementById('peek').addEventListener('click', () => {
    if(locked) return;
    locked = true;
    const cards = [...document.querySelectorAll('.card:not(.matched)')];
    cards.forEach(c => c.classList.add('flipped'));
    setTimeout(() => {
      cards.forEach(c => c.classList.remove('flipped'));
      locked = false;
    }, 3000);
  });

  start();
})();
</script>
</body>
</html>
